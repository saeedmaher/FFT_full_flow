<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">FFT UVM Verification Architecture</title>
  <desc id="desc">UVM test and sequences drive the sequencer, driver, interface, and FFT DUT. The monitor observes the interface and sends transactions to the scoreboard and coverage collector.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#102b4e"/>
    </linearGradient>
    <linearGradient id="uvm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173e70"/>
      <stop offset="1" stop-color="#245a91"/>
    </linearGradient>
    <linearGradient id="dut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e766e"/>
      <stop offset="1" stop-color="#16a394"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#66d9ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffd166"/>
    </marker>
    <style>
      .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#f5fbff}
      .subtitle{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#a9c4de}
      .box-title{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#fff;text-anchor:middle}
      .box-text{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#d7e9f8;text-anchor:middle}
      .label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#8ee7ff;text-anchor:middle}
      .gold-label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#ffe29a;text-anchor:middle}
      .outline{stroke:#71cbef;stroke-width:2;fill:url(#uvm)}
      .line{fill:none;stroke:#66d9ff;stroke-width:3;marker-end:url(#arrow)}
      .analysis{fill:none;stroke:#ffd166;stroke-width:3;marker-end:url(#arrowGold)}
    </style>
  </defs>

  <rect width="1400" height="820" rx="24" fill="url(#bg)"/>
  <text x="700" y="55" class="title" text-anchor="middle">FFT UVM Verification Architecture</text>
  <text x="700" y="84" class="subtitle" text-anchor="middle">16-point DIF R2SDF FFT · stimulus, checking, assertions, and coverage</text>

  <rect x="35" y="112" width="995" height="650" rx="22" fill="#0a1e38" stroke="#2e6e9e" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="62" y="145" class="subtitle">UVM testbench</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="225" height="105" rx="15" class="outline"/>
    <text x="182" y="210" class="box-title">FFT Test</text>
    <text x="182" y="237" class="box-text">builds environment</text>
    <text x="182" y="259" class="box-text">starts test sequences</text>

    <rect x="350" y="165" width="255" height="125" rx="15" class="outline"/>
    <text x="477" y="198" class="box-title">Sequences</text>
    <text x="477" y="225" class="box-text">MATLAB random vectors</text>
    <text x="477" y="247" class="box-text">DC · impulse · reset</text>
    <text x="477" y="269" class="box-text">FFT sequence items</text>

    <rect x="665" y="175" width="225" height="105" rx="15" class="outline"/>
    <text x="777" y="210" class="box-title">Sequencer</text>
    <text x="777" y="238" class="box-text">transaction arbitration</text>
    <text x="777" y="260" class="box-text">sequence-item channel</text>

    <rect x="665" y="350" width="225" height="105" rx="15" class="outline"/>
    <text x="777" y="386" class="box-title">Driver</text>
    <text x="777" y="413" class="box-text">transaction → pin activity</text>
    <text x="777" y="435" class="box-text">drives valid complex frames</text>

    <rect x="350" y="350" width="255" height="105" rx="15" class="outline"/>
    <text x="477" y="386" class="box-title">FFT Agent</text>
    <text x="477" y="413" class="box-text">sequencer · driver · monitor</text>
    <text x="477" y="435" class="box-text">configured by FFT config</text>

    <rect x="665" y="535" width="225" height="105" rx="15" class="outline"/>
    <text x="777" y="570" class="box-title">Monitor</text>
    <text x="777" y="597" class="box-text">samples input and output</text>
    <text x="777" y="619" class="box-text">publishes transactions</text>

    <rect x="70" y="515" width="225" height="105" rx="15" fill="#6d4c16" stroke="#ffd166" stroke-width="2"/>
    <text x="182" y="550" class="box-title">Scoreboard</text>
    <text x="182" y="577" class="box-text">expected vs. DUT output</text>
    <text x="182" y="599" class="box-text">frame and sample checking</text>

    <rect x="350" y="535" width="255" height="105" rx="15" fill="#6d4c16" stroke="#ffd166" stroke-width="2"/>
    <text x="477" y="570" class="box-title">Coverage Collector</text>
    <text x="477" y="597" class="box-text">functional bins and crosses</text>
    <text x="477" y="619" class="box-text">code + directive coverage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="300" width="270" height="145" rx="18" fill="#12365a" stroke="#8bdfff" stroke-width="2.5"/>
    <text x="1215" y="338" class="box-title">FFT Interface</text>
    <text x="1215" y="368" class="box-text">clk · rst_n · in_valid</text>
    <text x="1215" y="392" class="box-text">din_re/im · dout_re/im</text>
    <text x="1215" y="416" class="box-text">out_valid</text>

    <rect x="1080" y="535" width="270" height="145" rx="18" fill="url(#dut)" stroke="#63f1d8" stroke-width="2.5"/>
    <text x="1215" y="570" class="box-title">DIF_R2SDF_top</text>
    <text x="1215" y="600" class="box-text">four-stage streaming FFT DUT</text>
    <text x="1215" y="624" class="box-text">SVA output/reset checks</text>
    <text x="1215" y="648" class="box-text">12-bit complex datapath</text>
  </g>

  <path d="M295 225 H350" class="line"/>
  <path d="M605 225 H665" class="line"/>
  <path d="M777 280 V350" class="line"/>
  <path d="M890 402 H1080" class="line"/>
  <path d="M1215 445 V535" class="line"/>
  <path d="M1080 410 C980 410 980 587 890 587" class="line"/>
  <path d="M665 587 H605" class="analysis"/>
  <path d="M665 602 C560 710 265 710 182 620" class="analysis"/>

  <text x="322" y="211" class="label">starts</text>
  <text x="635" y="211" class="label">items</text>
  <text x="803" y="320" class="label">seq_item_port</text>
  <text x="976" y="389" class="label">virtual interface</text>
  <text x="1248" y="498" class="label">signal connection</text>
  <text x="960" y="527" class="label">observes</text>
  <text x="635" y="574" class="gold-label">analysis port</text>
  <text x="430" y="697" class="gold-label">observed transactions</text>

  <g transform="translate(75 720)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#66d9ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="82" y="5" class="subtitle">stimulus / signal flow</text>
    <line x1="280" y1="0" x2="345" y2="0" stroke="#ffd166" stroke-width="3" marker-end="url(#arrowGold)"/>
    <text x="362" y="5" class="subtitle">analysis transaction flow</text>
  </g>
</svg>
